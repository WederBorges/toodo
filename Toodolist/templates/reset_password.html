{% extends "bootstrap.html" %}
{% block title %}Redefinir senha — to-be list{% endblock %}

{% block content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center px-3"
     style="background:var(--bg-page);">
  <div style="width:100%; max-width:400px;">

    <div class="text-center mb-4">
      <img src="{{ url_for('static', filename='favicon.svg') }}"
           width="46" height="46" alt="To-be list" class="mb-3">
      <h1 style="font-size:22px; font-weight:700; color:var(--tx-1); letter-spacing:-0.02em; margin-bottom:4px;">
        To-be list
      </h1>
      <p style="font-size:13px; color:var(--tx-3); margin:0;">Escolha sua nova senha.</p>
    </div>

    <div class="card shadow-lg" style="background:var(--bg-surface); border:1px solid var(--ov-07);">
      <div class="card-body p-4">
        <h4 style="font-size:15px; font-weight:600; color:var(--tx-1); margin-bottom:20px;">
          Nova senha
        </h4>

        <form method="post" action="{{ url_for('auth.reset_password', token=token) }}">

          <div class="mb-3">
            <label for="senha" class="form-label"
                   style="font-size:11px; font-weight:600; letter-spacing:0.06em;
                          text-transform:uppercase; color:var(--tx-2);">
              Nova senha
            </label>
            <input type="password" class="form-control" id="senha" name="senha"
                   placeholder="mínimo 8 caracteres" minlength="8" required autofocus>
          </div>

          <div class="mb-4">
            <label for="senha_confirm" class="form-label"
                   style="font-size:11px; font-weight:600; letter-spacing:0.06em;
                          text-transform:uppercase; color:var(--tx-2);">
              Confirmar nova senha
            </label>
            <input type="password" class="form-control" id="senha_confirm" name="senha_confirm"
                   placeholder="repita a senha" minlength="8" required>
          </div>

          <button type="submit" class="btn btn-primary w-100"
                  style="padding:11px; font-size:14px; font-weight:700; letter-spacing:0.02em;">
            Redefinir senha
          </button>

        </form>
      </div>
    </div>

    <p class="text-center mt-3" style="font-size:13px; color:var(--tx-3); margin:0;">
      <a href="{{ url_for('auth.login') }}"
         style="color:#00C0CC; text-decoration:none; font-weight:600;">
        Voltar para o login
      </a>
    </p>

  </div>
</div>
{% endblock %}
