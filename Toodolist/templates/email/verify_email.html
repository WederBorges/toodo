<!doctype html>
<html lang="pt-br" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confirme seu email — To-be list</title>
  </head>
  <body style="margin:0; padding:0; background-color:#0D1117; font-family:Arial, Helvetica, sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#0D1117;">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table width="480" cellpadding="0" cellspacing="0" border="0"
                 style="max-width:480px; width:100%; background-color:#161B22; border:1px solid rgba(255,255,255,0.07); border-radius:8px;">
            <tr>
              <td style="padding:32px 36px 8px; text-align:center;">
                <div style="font-size:20px; font-weight:700; color:#E6EDF3; letter-spacing:-0.02em;">To-be list</div>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 36px 0;">
                <h1 style="font-size:20px; font-weight:700; color:#E6EDF3; margin:0 0 12px;">
                  Confirme seu email
                </h1>
                <p style="font-size:14px; color:#8B949E; line-height:1.6; margin:0 0 24px;">
                  Olá, {{ usuario.user }}! Para ativar sua conta e poder entrar, confirme seu endereço de email
                  clicando no botão abaixo. Este link expira em 24 horas.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:0 36px 28px; text-align:center;">
                <a href="{{ verify_url }}" target="_blank"
                   style="display:inline-block; background-color:#00C0CC; color:#0D1117; font-weight:700;
                          font-size:14px; text-decoration:none; padding:12px 32px; border-radius:6px;">
                  Confirmar email
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding:0 36px 32px;">
                <p style="font-size:12px; color:#6E7681; line-height:1.6; margin:0;">
                  Se você não criou uma conta no To-be list, pode ignorar este email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
