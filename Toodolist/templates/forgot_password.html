{% extends "bootstrap.html" %}
{% block title %}Esqueci a senha — to-be list{% endblock %}

{% block content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center px-3"
     style="background:#0D1117;">
  <div style="width:100%; max-width:400px;">

    <div class="text-center mb-4">
      <img src="{{ url_for('static', filename='favicon.svg') }}"
           width="46" height="46" alt="To-be list" class="mb-3">
      <h1 style="font-size:22px; font-weight:700; color:#E6EDF3; letter-spacing:-0.02em; margin-bottom:4px;">
        To-be list
      </h1>
      <p style="font-size:13px; color:#6E7681; margin:0;">Vamos te ajudar a voltar à sua lista.</p>
    </div>

    <div class="card shadow-lg" style="background:#161B22; border:1px solid rgba(255,255,255,0.07);">
      <div class="card-body p-4">
        <h4 style="font-size:15px; font-weight:600; color:#E6EDF3; margin-bottom:8px;">
          Redefinir senha
        </h4>
        <p style="font-size:13px; color:#8B949E; margin-bottom:20px;">
          Digite o email da sua conta e enviaremos um link para redefinir sua senha.
        </p>

        <form method="post" action="{{ url_for('auth.forgot_password') }}">

          <div class="mb-4">
            <label for="email" class="form-label"
                   style="font-size:11px; font-weight:600; letter-spacing:0.06em;
                          text-transform:uppercase; color:#8B949E;">
              Email
            </label>
            <input type="email" class="form-control" id="email" name="email"
                   placeholder="seu@email.com" required autofocus>
          </div>

          <button type="submit" class="btn btn-primary w-100"
                  style="padding:11px; font-size:14px; font-weight:700; letter-spacing:0.02em;">
            Enviar link de redefinição
          </button>

        </form>
      </div>
    </div>

    <p class="text-center mt-3" style="font-size:13px; color:#6E7681; margin:0;">
      <a href="{{ url_for('auth.login') }}"
         style="color:#00C0CC; text-decoration:none; font-weight:600;">
        Voltar para o login
      </a>
    </p>

  </div>
</div>
{% endblock %}
